# PR #13 only. Commit the already-tested, generated unified Worker source so
# that a direct Cloudflare release can use the exact audited GitHub artifact.
name: RecordNote build deployable Web bundle
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/build-recordnote-unified.mjs'
      - 'cloudflare-candidate/recordnote-web.mjs'
      - 'cloudflare-candidate/recordnote-worker.js'
      - 'vendor/starry-id/starry-client.ts'
      - 'vendor/starry-id/starry-sdk.ts'
      - '.github/workflows/recordnote-build-web-bundle.yml'
permissions:
  contents: write
jobs:
  build-bundle:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/recordnote-starry-id-v2026-11-07-7'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official SDK and full Web/API bundle without deployment
        run: |
          npm install --no-audit --no-fund
          npm run build:recordnote
          node -e "const f=require('fs').readFileSync('cloudflare-candidate/recordnote-unified.mjs','utf8');for(const s of ['shareWebSignIn','syncWebSignIn','signOutWebEverywhere','recordnote','export default'])if(!f.includes(s))throw Error('Missing v14 bundle code: '+s)"
      - name: Commit only the generated deployable bundle to this PR
        run: |
          set -euo pipefail
          if git diff --quiet -- cloudflare-candidate/recordnote-unified.mjs; then
            echo 'Bundle already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-candidate/recordnote-unified.mjs
          git commit -m "build(recordnote): synchronize audited v14 Web/API deployable Worker"
          git push origin HEAD:refs/heads/feature/recordnote-starry-id-v2026-11-07-7
