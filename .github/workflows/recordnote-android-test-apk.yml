# Build a signed internal test APK, inspect SHA-256 from that same APK.
# Draft PR #13 only. Does NOT deploy, sign with production key or alter Starry ID.
name: RecordNote Android test APK SHA256

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'native/**'
      - 'expo/RecordNoteStarryAuth.ts'
      - 'vendor/starry-id/starry-client.ts'
      - '.github/workflows/recordnote-android-test-apk.yml'

permissions:
  contents: read

concurrency:
  group: recordnote-test-apk-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android-test-apk:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37 using runner's existing cmdline-tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$SDKMANAGER" || { echo "::error::SDK manager missing on runner"; exit 1; }
          # The third-party setup-android action tries to install removed 'tools' package.
          # The hosted runner already supplies Android SDK command-line tools.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0"
          # Google publishes Android 37 as android-37.0; some Gradle plugins
          # still request android-37. Both names refer to the same platform.
          if test -d "$ANDROID_HOME/platforms/android-37.0" && ! test -e "$ANDROID_HOME/platforms/android-37"; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Install isolated Expo dependencies
        run: npm install --prefix native --no-audit --no-fund
      - name: Generate Android Gradle project
        working-directory: native
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build test APK with Android debug signing key
        working-directory: native/android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Read SHA256 from actual signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Signed APK not produced"; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n1)"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found on GitHub runner"; exit 1; }
          # The certificate fingerprint is PUBLIC metadata of the signed APK.
          # Print it in Actions logs so parsing problems can be diagnosed.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/recordnote-apk-certificate.txt"
          python3 - <<'PY'
          import pathlib, re, os, sys
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'recordnote-apk-certificate.txt'
          raw = report.read_text(encoding='utf-8')
          found = None
          for line in raw.splitlines():
              # New apksigner: "V2 Signer: certificate SHA-256 digest: ...".
              # Also accepts older "Signer #1 certificate SHA-256 digest: ...".
              match = re.search(r'\bcertificate\s+SHA-256\s+digest\s*:\s*([0-9a-fA-F:\s]+)', line, re.I)
              if not match:
                  continue
              candidate = re.sub(r'[:\s]', '', match.group(1)).lower()
              if re.fullmatch(r'[0-9a-f]{64}', candidate):
                  found = candidate
                  break
          if not found:
              print('::error::Verified APK contains no readable signer SHA-256; see apksigner public certificate output above.')
              sys.exit(1)
          pathlib.Path('native/RecordNote-Android-test-SHA256.txt').write_text(found + '\n', encoding='ascii')
          print('RecordNote signed APK certificate SHA-256: ' + found)
          PY
          {
            echo '## RecordNote Android 測試 APK SHA-256'
            echo
            echo '本次產生的測試 APK 的真實 SHA-256 指紋：'
            echo
            cat native/RecordNote-Android-test-SHA256.txt
            echo
            echo 'App ID: phd.starry.recordnote'
            echo '下載：本次執行頁面下方 Artifacts → RecordNote-test-APK-with-SHA256'
            echo '安裝同一次產生的 app-release.apk，才能對應這組指紋。'
            echo '登記：https://id.starry.phd/admin/apps → RecordNote → 編輯登記資料'
            echo '不同測試建置可能有不同指紋；Google Play 正式版須另取正式簽署憑證。'
            echo '僅供內部驗收，不部署 Worker、不上傳商店、不自動登記。'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload matching test APK and certificate SHA256
        uses: actions/upload-artifact@v4
        with:
          name: RecordNote-test-APK-with-SHA256
          retention-days: 14
          if-no-files-found: error
          path: |
            native/android/app/build/outputs/apk/release/app-release.apk
            native/RecordNote-Android-test-SHA256.txt
