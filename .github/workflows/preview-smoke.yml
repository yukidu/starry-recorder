name: Preview smoke test
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check preview health via HTTPS
        run: |
          curl --fail --show-error --silent --retry 3 --retry-delay 3             "https://starry-recorder-preview.yukidu.workers.dev/healthz"             --output /tmp/recorder-health.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('/tmp/recorder-health.json','utf8'));if(a.service!=='starry-recorder-preview'||a.ready!==false||a.recording!==false||a.billing!==false||a.milestone!=='v6-data-protection')process.exit(1)"
      - name: Verify preview page and noindex
        run: |
          curl --fail --show-error --silent             -D /tmp/recorder-headers             "https://starry-recorder-preview.yukidu.workers.dev/"             --output /tmp/recorder-body
          grep -qi 'x-robots-tag: noindex, nofollow, noarchive' /tmp/recorder-headers
          grep -q '尚未正式上線' /tmp/recorder-body
          grep -q 'AI 額度防重複計算' /tmp/recorder-body
          grep -q '跨會員權限測試通過' /tmp/recorder-body
      - name: Verify API cannot accept private writes
        run: |
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST 'https://starry-recorder-preview.yukidu.workers.dev/api/upload')"
          test "$code" = 405
